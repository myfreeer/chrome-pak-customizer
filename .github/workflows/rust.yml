name: Rust

on:
  push:
    branches: [ 3.x ]
  pull_request:
    branches: [ 3.x ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Build
      run: cargo build --verbose
    - name: Cargo test
      run: cargo test --verbose --no-fail-fast
    - name: Build Release
      run: cargo build --verbose --release
    - name: Download test files
      run: ./script/ci-download.sh
    - name: Test
      run: ./script/ci-run.sh
    - uses: actions/upload-artifact@v6
      with:
        name: linux-artifact
        path: |
          target/debug/chrome-pak-customizer
          target/release/chrome-pak-customizer

  build-linux-musl:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Install musl toolchain
      run: sudo apt-get update && sudo apt-get install -y musl-tools
    - name: Add musl target
      run: rustup target add x86_64-unknown-linux-musl
    - name: Build Release
      run: cargo build --verbose --release --target x86_64-unknown-linux-musl
    - name: Smoke test musl binary
      run: target/x86_64-unknown-linux-musl/release/chrome-pak-customizer -h > /dev/null
    - uses: actions/upload-artifact@v6
      with:
        name: linux-musl-artifact
        path: |
          target/x86_64-unknown-linux-musl/release/chrome-pak-customizer

  build-windows:

    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: cargo build --verbose
      - name: Cargo test
        run: cargo test --verbose --no-fail-fast
      - name: Build Release
        run: cargo build --verbose --release
      - name: Download test files
        run: PowerShell.exe -ExecutionPolicy Bypass -File ./script/ci-download.ps1
      - name: Test
        run: PowerShell.exe -ExecutionPolicy Bypass -File ./script/ci-run.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: windows-artifact
          path: |
            target/debug/*.exe
            target/release/*.exe

  build-macos:

    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: cargo build --verbose
      - name: Cargo test
        run: cargo test --verbose --no-fail-fast
      - name: Build Release
        run: cargo build --verbose --release
      - name: Download test files
        run: ./script/ci-download.sh
      - name: Install coreutils
        run: brew install coreutils
      - name: Test
        run: ./script/ci-run.sh
      - uses: actions/upload-artifact@v6
        with:
          name: macos-artifact
          path: |
            target/debug/chrome-pak-customizer
            target/release/chrome-pak-customizer
