[package]
name = "chrome-pak-customizer"
version = "3.0.0"
edition = "2021"
rust-version = "1.59"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ini_core = "0.2.0"
brotli-decompressor = "5"
memmap2 = "=0.5.10"

[target.'cfg(unix)'.dependencies]
# Keep memmap2's Unix syscall dependency inside this repo's Rust 1.59 MSRV.
libc = "=0.2.147"

[profile.release]
strip = true  # Automatically strip symbols from the binary.
lto = true
panic = "abort"
